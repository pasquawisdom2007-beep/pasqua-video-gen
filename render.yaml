services:
  - type: web
    name: cinematic-video-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: RATE_MAX_REQUESTS
        value: "5"
      - key: RATE_WINDOW_MS
        value: "60000"
      - key: HF_TOKEN
        sync: false
      - key: ADMIN_KEY
        generateValue: true
